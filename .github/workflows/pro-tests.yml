name: Pro isolated tests
on:
  push:
    branches: [dev/pro-v02-integrated]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest==8.3.5
      - run: python -m pytest -q
