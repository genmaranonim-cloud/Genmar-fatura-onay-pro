name: Deploy to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [dev/pro-v02-integrated]
    paths:
      - "app.py"
      - "invoice_reader.py"
      - "models_v2.py"
      - "pro_documents.py"
      - "requirements.txt"
      - "Dockerfile.cloudflare"
      - "cloudflare/**"
      - "wrangler.jsonc"
      - "package.json"
      - ".github/workflows/cloudflare-deploy.yml"

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - name: Deploy Worker and Container
        run: npm run cf:deploy
      - name: Configure application secrets
        env:
          PRO_ADMIN_PASSWORD: ${{ secrets.PRO_ADMIN_PASSWORD }}
          PRO_SECRET_KEY: ${{ secrets.PRO_SECRET_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          printf '%s' "$PRO_ADMIN_PASSWORD" | npx wrangler secret put PRO_ADMIN_PASSWORD
          printf '%s' "$PRO_SECRET_KEY" | npx wrangler secret put PRO_SECRET_KEY
          printf '%s' "$R2_ACCESS_KEY_ID" | npx wrangler secret put R2_ACCESS_KEY_ID
          printf '%s' "$R2_SECRET_ACCESS_KEY" | npx wrangler secret put R2_SECRET_ACCESS_KEY
