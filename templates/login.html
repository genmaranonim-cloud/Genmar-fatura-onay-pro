<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giriş — Genmar Fatura Onay</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f1117;--surface:#1a1d27;--border:#2e3249;--accent:#4f6ef7;--accent2:#7c8ff5;--text:#e8eaf6;--text2:#8b90b8;--red:#f04f59;--radius:10px;--font:'Segoe UI',system-ui,sans-serif}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;display:flex;align-items:center;justify-content:center}
.kart{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:40px;width:360px;display:flex;flex-direction:column;gap:24px}
.logo{text-align:center}
.logo .brand{font-size:26px;font-weight:800;color:var(--accent2);letter-spacing:2px}
.logo .sub{font-size:13px;color:var(--text2);margin-top:4px}
.form-group{display:flex;flex-direction:column;gap:6px}
.form-label{font-size:11px;color:var(--text2);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.form-control{background:#0f1117;border:1px solid var(--border);border-radius:8px;color:var(--text);padding:11px 14px;font-size:14px;font-family:var(--font);outline:none;transition:border-color .15s}
.form-control:focus{border-color:var(--accent)}
.btn{width:100%;padding:12px;border-radius:8px;border:none;cursor:pointer;font-size:15px;font-weight:700;font-family:var(--font);background:var(--accent);color:white;transition:background .15s;margin-top:4px}
.btn:hover{background:var(--accent2)}
.hata{background:rgba(240,79,89,.1);border:1px solid rgba(240,79,89,.3);border-radius:8px;padding:10px 14px;font-size:13px;color:var(--red)}
.bilgi{font-size:12px;color:var(--text2);text-align:center;line-height:1.5}
.version{font-size:11px;color:var(--accent2);text-align:center;font-weight:700;letter-spacing:.4px}
</style>
</head>
<body>
<div class="kart">
    <div class="logo">
        <div class="brand">GENMAR</div>
        <div class="sub">Fatura Onay Sistemi</div>
        <div class="version">V0.2 – TEST</div>
    </div>

    {% if hata %}
    <div class="hata">⚠ {{ hata }}</div>
    {% endif %}

    <form method="POST">
        <div style="display:flex;flex-direction:column;gap:16px">
            <div class="form-group">
                <label class="form-label">Ad Soyad</label>
                <input type="text" name="ad_soyad" class="form-control"
                       placeholder="Adınızı yazın" autocomplete="off" autofocus>
            </div>
            <div class="form-group">
                <label class="form-label">Şifre</label>
                <input type="password" name="sifre" class="form-control" placeholder="••••••">
            </div>
            <button type="submit" class="btn">Giriş Yap</button>
        </div>
    </form>

    <div class="bilgi">İlk girişte şifreniz <strong>1</strong>'dir.<br>Profil menüsünden değiştirebilirsiniz.</div>
</div>
</body>
</html>
