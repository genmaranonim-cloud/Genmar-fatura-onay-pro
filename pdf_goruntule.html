<!doctype html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ dosya_adi }}</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 18px; background: #2c2c2c; color: #fff; font-family: Arial, sans-serif; }
        .sayfalar { display: flex; flex-direction: column; align-items: center; gap: 18px; }
        .sayfa { display: block; width: min(100%, 1100px); height: auto; background: white; box-shadow: 0 3px 16px rgba(0,0,0,.45); }
        .hata { max-width: 560px; margin: 80px auto; padding: 24px; border-radius: 10px; background: #fff; color: #8b1e1e; text-align: center; }
        .bos { text-align: center; padding: 50px; color: #ddd; }
        @media (max-width: 700px) { body { padding: 6px; } .sayfalar { gap: 8px; } }
    </style>
</head>
<body>
    {% if hata %}
    <div class="hata">{{ hata }}</div>
    {% elif sayfalar %}
    <main class="sayfalar">
        {% for sayfa in sayfalar %}
        <img class="sayfa" src="data:image/png;base64,{{ sayfa }}" alt="Fatura sayfası {{ loop.index }}">
        {% endfor %}
    </main>
    {% else %}
    <div class="bos">Bu faturada görüntülenecek sayfa bulunamadı.</div>
    {% endif %}
</body>
</html>
